<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 360" width="380" height="360" role="img" aria-labelledby="t d">
<title id="t">Pebble waving hello</title>
<desc id="d">Pebble, a friendly clay-colored stone with a sprout on top, hops, waves hello and blinks.</desc>
<style>
:root{--clay:#D9A58A;--clay-dark:#B97F66;--clay-light:#EFC8B2;--ink:#3A241C;--blush:#E8836F}
svg *{transform-box:fill-box}
.hop{transform-origin:50% 100%;animation:hop 6s ease-in-out infinite}
.shadow{transform-origin:50% 50%;animation:shadow 6s ease-in-out infinite}
.wave{transform-origin:0% 85%;animation:wave 6s ease-in-out infinite}
.nub{transform-origin:100% 20%;animation:nub 1.6s ease-in-out infinite alternate}
.sway{transform-origin:50% 100%;animation:sway 3s ease-in-out infinite alternate}
.blink{transform-origin:50% 50%;animation:blink 4.2s infinite}
.spark{opacity:0;transform-origin:50% 50%;animation:spark 6s ease-in-out infinite}
.s2{animation-delay:.35s}
@keyframes hop{0%,100%{transform:translateY(0) scale(1)}5%{transform:translateY(0) scale(1.04,.93)}13%{transform:translateY(-18px) scale(.97,1.04)}21%{transform:translateY(0) scale(1.03,.96)}27%{transform:translateY(0) scale(1)}}
@keyframes shadow{0%,100%,27%{transform:scale(1);opacity:1}13%{transform:scale(.88);opacity:.7}}
@keyframes wave{0%,28%,60%,100%{transform:rotate(0)}33%{transform:rotate(-16deg)}39%{transform:rotate(14deg)}45%{transform:rotate(-16deg)}51%{transform:rotate(14deg)}56%{transform:rotate(-8deg)}}
@keyframes nub{from{transform:rotate(-7deg)}to{transform:rotate(7deg)}}
@keyframes sway{from{transform:rotate(-6deg)}to{transform:rotate(6deg)}}
@keyframes blink{0%,90%,100%{transform:scaleY(1)}94%{transform:scaleY(.1)}}
@keyframes spark{0%,30%{opacity:0;transform:scale(.4) rotate(0)}40%{opacity:1;transform:scale(1) rotate(20deg)}52%{opacity:0;transform:scale(.5) rotate(40deg)}100%{opacity:0}}
@media (prefers-reduced-motion:reduce){svg *{animation:none!important}.spark{opacity:0}}
</style>

<ellipse class="shadow" cx="170" cy="338" rx="120" ry="11" fill="#EBD3BC"/>

<g class="hop">
<ellipse cx="124" cy="324" rx="26" ry="12" fill="var(--clay-dark)"/>
<ellipse cx="212" cy="324" rx="26" ry="12" fill="var(--clay-dark)"/>
<path d="M44 244 C40 166 114 116 190 120 C276 124 316 186 304 252 C296 304 232 322 166 322 C96 322 48 306 44 244 Z" fill="var(--clay)"/>
<path d="M78 168 C96 138 132 124 170 124 C138 138 112 154 98 188 Z" fill="var(--clay-light)" opacity=".85"/>
<ellipse cx="170" cy="282" rx="86" ry="38" fill="var(--clay-light)" opacity=".7"/>
<circle cx="250" cy="170" r="5" fill="var(--clay-dark)"/>
<circle cx="270" cy="198" r="3.5" fill="var(--clay-dark)"/>
<circle cx="82" cy="262" r="4" fill="var(--clay-dark)"/>
<circle cx="236" cy="150" r="3" fill="var(--clay-dark)"/>

<g class="sway">
<path d="M176 124 C176 106 178 94 182 80" fill="none" stroke="#5E8C61" stroke-width="6" stroke-linecap="round"/>
<path d="M182 84 C162 82 148 68 146 50 C166 50 180 62 182 84 Z" fill="#7DB07F"/>
<path d="M182 90 C200 88 214 76 218 58 C198 56 184 68 182 90 Z" fill="#6AA06D"/>
<circle cx="226" cy="52" r="9" fill="var(--blush)"/>
<circle cx="226" cy="52" r="3.5" fill="#FBEEDF"/>
</g>

<g class="blink">
<ellipse cx="124" cy="228" rx="11" ry="13" fill="var(--ink)"/>
<ellipse cx="212" cy="228" rx="11" ry="13" fill="var(--ink)"/>
<circle cx="128" cy="222" r="4" fill="#FFF6EC"/>
<circle cx="216" cy="222" r="4" fill="#FFF6EC"/>
</g>
<circle cx="92" cy="260" r="14" fill="var(--blush)" opacity=".55"/>
<circle cx="246" cy="260" r="14" fill="var(--blush)" opacity=".55"/>
<path d="M146 260 Q168 292 190 260 Q168 268 146 260 Z" fill="#6B3A33" stroke="#6B3A33" stroke-width="4" stroke-linejoin="round"/>
<path d="M157 276 Q168 286 179 276 Q168 272 157 276 Z" fill="#E88A7B"/>

<ellipse class="nub" cx="46" cy="262" rx="14" ry="19" fill="var(--clay)"/>

<g class="wave">
<path d="M296 262 C316 258 326 244 334 230" fill="none" stroke="var(--clay)" stroke-width="20" stroke-linecap="round"/>
<circle cx="338" cy="222" r="19" fill="var(--clay)"/>
<path d="M316 204 C312 194 318 190 324 196 C328 200 328 208 326 214 Z" fill="var(--clay)"/>
<circle cx="344" cy="212" r="6" fill="var(--clay-light)" opacity=".8"/>
</g>
</g>

<g transform="translate(362,176)"><path class="spark" d="M0 -10 L3 -3 L10 0 L3 3 L0 10 L-3 3 L-10 0 L-3 -3 Z" fill="#F2B632"/></g>
<g transform="translate(350,150)"><path class="spark s2" d="M0 -7 L2 -2 L7 0 L2 2 L0 7 L-2 2 L-7 0 L-2 -2 Z" fill="#E8836F"/></g>
</svg>
